# Summaries written by the maintainers of this repository, in our own words.
# They are NOT syllabus text. They are a map: for the exact content, read the section
# given in the official syllabus (ISTQB CTFL v4.0.1).
#
# short:   one line, used in the _index.md files and in llms.txt
# summary: 2 to 4 sentences, used in the shell of each section

"0":
  short: "Why the syllabus exists, who it is for, K-levels, the exam and how the chapters are laid out."
  summary: >-
    Non-examinable introduction. Covers what the document is for, who the Foundation Level certificate targets,
    the ISTQB career path, the 14 business outcomes (FL-BO1 to BO14), the K1 to K3 cognitive levels and how the six
    examinable chapters are organised and timed (1135 minutes in total).
"0.1":
  short: "Who ISTQB provides the syllabus to, and for what."
"0.2":
  short: "Target audience of the Foundation Level certificate."
"0.3":
  short: "ISTQB certification paths after Foundation Level."
"0.4":
  short: "The 14 business outcomes expected from a certified tester."
"0.5":
  short: "Cognitive levels K1, K2 and K3; keywords are always examinable at least at K1."
"0.6":
  short: "The exam is built on chapters 1 to 6; introduction and appendices are not examined."
"0.7":
