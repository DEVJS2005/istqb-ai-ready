# ---------------------------------------------------------------- Capítulo 1
"1":
  curto: "Fundamentos: o que é teste, por que testar, os 7 princípios, processo, testware, papéis e habilidades."
  resumo: >-
    Base conceitual de todo o resto. Define teste e seus objetivos, separa teste de depuração e de
    garantia da qualidade, apresenta a cadeia erro → defeito → falha, os sete princípios, as atividades
    do processo de teste com seus produtos (testware), a rastreabilidade, os papéis e as habilidades do testador.
"1.1":
  curto: "Teste como conjunto de atividades para achar defeitos e avaliar qualidade, com verificação e validação."
  resumo: >-
    Teste não é só executar casos de teste: inclui planejar, analisar, projetar e avaliar produtos de trabalho.
    Envolve verificação (atende ao especificado?) e validação (atende à necessidade real?), pode ser
    estático ou dinâmico e é uma atividade intelectual, não só técnica.
"1.1.1":
  curto: "Objetivos típicos de teste e como o contexto os altera."
  resumo: >-
    Lista os objetivos comuns: avaliar produtos de trabalho, provocar falhas e achar defeitos, garantir
    cobertura, reduzir risco, verificar requisitos e conformidade, informar decisões, gerar confiança e validar.
    Os objetivos variam conforme o produto, o nível de teste, os riscos, o ciclo de vida e o negócio.
"1.1.2":
  curto: "Teste e depuração são atividades distintas."
  resumo: >-
    O teste revela falhas (dinâmico) ou defeitos (estático); a depuração (debugging) encontra a causa e corrige.
    Após a correção vêm o teste de confirmação e, se preciso, o teste de regressão. Defeitos achados em
    teste estático dispensam reprodução e diagnóstico.
"1.2":
  curto: "Teste como controle da qualidade, que pode ser praticado por qualquer stakeholder."
  resumo: >-
    Teste é uma forma de controle da qualidade que ajuda a cumprir objetivos dentro de escopo, prazo,
    qualidade e orçamento. A contribuição para o sucesso não fica restrita ao time de teste.
"1.2.1":
  curto: "Como o teste contribui para o sucesso do projeto."
  resumo: >-
    O teste detecta defeitos de forma econômica, mede a qualidade ao longo do ciclo (apoiando decisões como
    a de liberar), representa indiretamente os usuários no projeto e pode ser exigido por contrato,
    lei ou regulação.
"1.2.2":
  curto: "Diferença entre teste (controle, produto) e QA (garantia, processo)."
  resumo: >-
    Teste é orientado ao produto e corretivo; garantia da qualidade (QA) é orientada ao processo e preventiva.
    QA é responsabilidade de todos. Os resultados de teste servem ao teste (corrigir defeitos) e à QA
    (feedback sobre os processos).
"1.2.3":
  curto: "Cadeia erro → defeito → falha e o conceito de causa raiz."
  resumo: >-
    Pessoas cometem erros (error), que geram defeitos (defect), que podem causar falhas (failure) quando executados.
    Falhas também podem vir do ambiente. A causa raiz (root cause) é a razão fundamental do problema, encontrada
    por análise de causa raiz para evitar recorrências.
"1.3":
  curto: "Os sete princípios de teste."
  resumo: >-
    Teste mostra presença, não ausência, de defeitos; teste exaustivo é impossível; testar cedo economiza;
    defeitos se agrupam; testes se desgastam; teste depende do contexto; e a falácia da ausência de defeitos
    (verificar não basta, é preciso validar).
"1.4":
  curto: "O processo de teste: atividades, testware e papéis, adaptados ao contexto."
  resumo: >-
    Há conjuntos comuns de atividades que formam um processo de teste, adaptado a cada situação durante
    o planejamento. As subseções tratam das atividades, do contexto, do testware, da rastreabilidade e dos papéis.
"1.4.1":
  curto: "As sete atividades do processo de teste, do planejamento à conclusão."
  resumo: >-
    Planejamento; monitoramento e controle; análise ("o que testar"); modelagem ou projeto ("como testar");
    implementação; execução; e conclusão. As atividades parecem sequenciais, mas costumam ser iterativas
    ou paralelas e devem ser adaptadas ao sistema e ao projeto.
"1.4.2":
  curto: "Fatores de contexto que moldam o processo de teste."
  resumo: >-
    Stakeholders, equipe, domínio de negócio, fatores técnicos, restrições do projeto, organização, ciclo de vida
    e ferramentas influenciam a estratégia, as técnicas, a automação, a cobertura exigida, o detalhamento
    do testware e os relatórios.
"1.4.3":
  curto: "Produtos de trabalho (testware) gerados em cada atividade de teste."
  resumo: >-
    Associa a cada atividade seus artefatos típicos: plano e registro de riscos no planejamento; relatórios
    de progresso no monitoramento; condições de teste na análise; casos de teste e cartas de teste no projeto;
    procedimentos, scripts e dados na implementação; logs e relatórios de defeito na execução; relatório de conclusão.
"1.4.4":
  curto: "Rastreabilidade entre base de teste, testware, resultados e defeitos."
  resumo: >-
    Manter rastreabilidade permite avaliar cobertura (ex.: requisitos cobertos por casos de teste), risco residual
    e impacto de mudanças, além de facilitar auditorias e deixar os relatórios mais compreensíveis.
"1.4.5":
  curto: "Os dois papéis principais: gestão de teste e teste."
  resumo: >-
    O papel de gestão de teste cuida de planejamento, monitoramento, controle e conclusão. O papel de teste cuida
    da parte técnica: análise, projeto, implementação e execução. Uma pessoa pode acumular os dois, e
    quem exerce cada papel depende do contexto.
"1.5":
  curto: "Habilidades essenciais e boas práticas do testador."
  resumo: >-
    Bons testadores precisam de habilidades específicas, trabalham bem em equipe e conseguem atuar com
    diferentes graus de independência.
"1.5.1":
  curto: "Habilidades genéricas relevantes para testar, com destaque para comunicação."
  resumo: >-
    Conhecimento de teste, atenção a detalhes e curiosidade, comunicação e escuta, pensamento analítico e crítico,
    conhecimento técnico e de domínio. Como o testador costuma trazer más notícias, deve comunicar defeitos
    de forma construtiva, ciente do viés de confirmação.
"1.5.2":
  curto: "Abordagem de equipe inteira (whole team approach)."
  resumo: >-
    Prática vinda do XP em que qualquer membro capacitado executa qualquer tarefa e todos são responsáveis
    pela qualidade. Melhora comunicação e sinergia, e o testador colabora com o negócio e com os desenvolvedores.
    Pode não servir em contextos que exigem alta independência, como sistemas críticos de segurança.
"1.5.3":
  curto: "Graus de independência do teste, com benefícios e desvantagens."
  resumo: >-
    Vai de nenhuma (o próprio autor) a muito alta (externo à organização), e o ideal costuma combinar vários níveis.
    A independência traz outros vieses e perspectivas, mas pode isolar o testador, gerar atrito, reduzir o
    senso de responsabilidade dos desenvolvedores e transformar o teste em gargalo.

# ---------------------------------------------------------------- Capítulo 2
"2":
  curto: "Teste ao longo do ciclo de vida: modelos de SDLC, test-first, DevOps, shift left, níveis, tipos e manutenção."
  resumo: >-
    Mostra como o teste se adapta ao modelo de desenvolvimento, as abordagens que usam testes para guiar o
    desenvolvimento (TDD, ATDD, BDD), DevOps, shift left e retrospectivas. Define os cinco níveis e os quatro tipos
    de teste, diferencia confirmação de regressão e trata do teste de manutenção.
"2.1":
  curto: "Modelos de ciclo de vida (sequencial, iterativo, incremental) e métodos ágeis."
  resumo: >-
    Um modelo de SDLC descreve como as fases e atividades de desenvolvimento se relacionam. Exemplos: cascata e
    modelo V (sequenciais), espiral e prototipação (iterativos), Unified Process (incremental), além de práticas
    como Scrum, Kanban, XP, TDD, ATDD e BDD.
"2.1.1":
  curto: "Como a escolha do SDLC muda o teste."
  resumo: >-
    O SDLC define o escopo e o momento das atividades, o nível de documentação, as técnicas, o grau de automação
    e o papel do testador. Em modelos sequenciais o teste dinâmico vem tarde; em iterativos há teste em toda
    iteração com muita regressão; em ágil prevalecem documentação leve, automação e técnicas baseadas em experiência.
"2.1.2":
  curto: "Boas práticas de teste válidas para qualquer SDLC."
  resumo: >-
    Toda atividade de desenvolvimento tem uma atividade de teste correspondente; cada nível de teste tem objetivos
    próprios; a análise e o projeto de teste começam na fase de desenvolvimento correspondente; e os testadores
    revisam rascunhos assim que existem.
"2.1.3":
  curto: "TDD, ATDD e BDD: testes definidos antes do código guiam o desenvolvimento."
  resumo: >-
    TDD guia a codificação com casos de teste e refatoração; ATDD deriva testes dos critérios de aceite antes do
    desenvolvimento; BDD descreve o comportamento em linguagem natural (Given/When/Then) que vira teste executável.
    Todos aplicam teste antecipado e shift left.
"2.1.4":
  curto: "DevOps e seus benefícios e riscos para o teste."
  resumo: >-
    DevOps aproxima desenvolvimento e operação com CI/CD e pipeline de entrega. Benefícios: feedback rápido, shift left,
    ambientes estáveis, visibilidade de requisitos não funcionais e menos regressão manual. Riscos: definir o pipeline,
    manter ferramentas e custear a automação. O teste manual do ponto de vista do usuário continua necessário.
"2.1.5":
  curto: "Shift left: testar mais cedo, sem abandonar o teste tardio."
  resumo: >-
    Práticas: revisar especificações com olhar de teste, escrever testes antes do código, usar CI/CD, fazer análise
    estática antes do teste dinâmico e começar o teste não funcional já no nível de componente. Custa mais no início,
    economiza depois e precisa da adesão dos stakeholders.
"2.1.6":
  curto: "Retrospectivas como mecanismo de melhoria contínua."
  resumo: >-
    Reuniões no fim de iterações, marcos ou projetos discutem o que manter, o que melhorar e como.
    Os resultados entram no relatório de conclusão. Benefícios: eficácia, qualidade do testware e da base de teste,
    aprendizado do time e cooperação entre desenvolvimento e teste.
"2.2":
  curto: "Níveis de teste (quando/onde) e tipos de teste (o quê)."
  resumo: >-
    Níveis de teste são grupos de atividades organizados juntos, em cada fase de desenvolvimento. Tipos de teste
    agrupam atividades por característica de qualidade e podem ocorrer em qualquer nível.
"2.2.1":
  curto: "Os cinco níveis: componente, integração de componentes, sistema, integração de sistemas e aceite."
  resumo: >-
    Teste de componente (unidade) isola partes; o de integração de componentes testa interfaces entre elas; o de sistema
    avalia o todo, funcional e não funcional; o de integração de sistemas cobre interfaces externas; e o de aceite valida
    a prontidão para uso (UAT, operacional, contratual, regulatório, alfa, beta). Os níveis se distinguem por objeto,
    objetivos, base, defeitos e responsáveis.
"2.2.2":
  curto: "Os quatro tipos: funcional, não funcional, caixa-preta e caixa-branca."
  resumo: >-
    Funcional cobre "o que" o sistema faz; não funcional cobre "quão bem", segundo as características da ISO/IEC 25010
    (desempenho, compatibilidade, usabilidade, confiabilidade, segurança, manutenibilidade, portabilidade, safety).
    Caixa-preta deriva testes da especificação e caixa-branca, da estrutura interna. Todos se aplicam a todos os níveis.
"2.2.3":
  curto: "Teste de confirmação (o defeito foi corrigido?) vs teste de regressão (a mudança quebrou algo?)."
  resumo: >-
    A confirmação reexecuta os testes que falharam ou cria novos para a correção. A regressão verifica efeitos colaterais
    no componente, no sistema ou em sistemas conectados, guiada por análise de impacto. Suítes de regressão crescem
    a cada entrega e são fortes candidatas à automação, inclusive em CI.
"2.3":
  curto: "Teste de manutenção: escopo e gatilhos (modificação, migração, aposentadoria)."
  resumo: >-
    A manutenção pode ser corretiva, adaptativa ou de melhoria, planejada ou emergencial (hotfix). O escopo depende do
    risco, do tamanho do sistema e do tamanho da mudança. Os gatilhos são modificações, upgrades ou migrações de ambiente
    (incluindo conversão de dados) e aposentadoria (arquivamento, restauração e recuperação de dados).

# ---------------------------------------------------------------- Capítulo 3
"3":
  curto: "Teste estático: produtos examináveis, valor, diferença para o dinâmico, feedback e processo de revisão."
  resumo: >-
    Cobre o teste sem executar o software: revisões manuais e análise estática por ferramenta. Explica o valor de
    encontrar defeitos cedo, a importância do feedback frequente dos stakeholders, as atividades e os papéis de uma
    revisão, os tipos de revisão e os fatores de sucesso.
"3.1":
  curto: "Fundamentos do teste estático: revisões e análise estática."
  resumo: >-
    O teste estático avalia código, especificações e outros produtos sem executá-los, buscando defeitos e características
    como legibilidade e testabilidade. Serve à verificação e à validação, inclusive no refinamento de user stories, e a análise
    estática costuma rodar dentro da CI.
"3.1.1":
  curto: "Produtos de trabalho que podem (ou não) passar por teste estático."
  resumo: >-
    Quase tudo pode ser revisado: requisitos, código, planos e casos de teste, backlog, contratos, modelos. A análise estática
    exige estrutura formal (código, modelos). Ficam de fora itens difíceis de interpretar ou que não devem ser analisados,
    como código executável de terceiros.
"3.1.2":
  curto: "Por que o teste estático vale a pena."
  resumo: >-
    Encontra defeitos nas fases mais iniciais e alguns que o teste dinâmico não alcança (código inalcançável, defeitos
    em documentos). Cria entendimento comum entre stakeholders e, apesar do custo, reduz o custo total do projeto.
"3.1.3":
  curto: "Diferenças entre teste estático e dinâmico e defeitos típicos de cada um."
  resumo: >-
    O estático acha defeitos diretamente, alcança caminhos pouco executados, vale para produtos não executáveis e mede
    características como manutenibilidade. O dinâmico provoca falhas e mede, por exemplo, desempenho. O estático é mais
    barato para defeitos de requisitos, design, código, padrões, interfaces, algumas vulnerabilidades e lacunas de cobertura.
"3.2":
  curto: "Feedback dos stakeholders e o processo de revisão."
  resumo: >-
    Reúne os benefícios do feedback cedo e frequente e os elementos de uma revisão: atividades, papéis, tipos e fatores de sucesso.
"3.2.1":
  curto: "Benefícios do feedback cedo e frequente dos stakeholders."
  resumo: >-
    Revela problemas de qualidade cedo, evita mal-entendidos sobre requisitos e ajuda o time a focar no que entrega mais valor.
    Sem esse feedback, o risco é retrabalho, atraso e até fracasso do projeto.
"3.2.2":
  curto: "As cinco atividades do processo de revisão (ISO/IEC 20246)."
  resumo: >-
    Planejamento (escopo, critérios de saída, esforço); início da revisão (todos preparados e com acesso); revisão individual
    (anomalias, recomendações e perguntas); comunicação e análise (decidir o status de cada anomalia); e correção e relato.
    Quanto mais formal a revisão, mais tarefas são feitas.
"3.2.3":
  curto: "Papéis na revisão: gerente, autor, moderador, escriba, revisor e líder da revisão."
  resumo: >-
    O gerente decide o que revisar e provê recursos; o autor cria e corrige; o moderador (facilitador) conduz as reuniões;
    o escriba registra anomalias e decisões; os revisores revisam; e o líder da revisão responde pela revisão como um todo.
"3.2.4":
  curto: "Tipos de revisão: informal, walkthrough, revisão técnica e inspeção."
  resumo: >-
    A formalidade depende do SDLC, da maturidade, da criticidade, de exigências legais e da necessidade de trilha de auditoria.
    A revisão informal não segue processo definido; o walkthrough é conduzido pelo autor; a revisão técnica busca consenso
    técnico e é moderada; a inspeção é a mais formal, coleta métricas e não permite o autor como líder ou escriba.
"3.2.5":
  curto: "Fatores de sucesso das revisões."
  resumo: >-
    Objetivos claros e critérios de saída mensuráveis (nunca avaliar pessoas), tipo de revisão adequado, partes pequenas,
    feedback aos autores, tempo de preparação, apoio da gestão, cultura de revisão, treinamento e reuniões facilitadas.

# ---------------------------------------------------------------- Capítulo 4
"4":
  curto: "Técnicas de teste: caixa-preta, caixa-branca, baseadas em experiência e abordagens colaborativas."
  resumo: >-
    O capítulo mais extenso e o que mais exige aplicação (K3). Classifica as técnicas, detalha particionamento de equivalência,
    análise de valor limite, tabela de decisão e transição de estados, cobertura de instrução e de ramo, suposição de erro,
    teste exploratório, teste baseado em checklist, user stories colaborativas, critérios de aceite e ATDD.
"4.1":
  curto: "Visão geral e classificação das técnicas de teste."
  resumo: >-
    Técnicas ajudam a definir condições de teste, itens de cobertura e dados de forma sistemática. Caixa-preta parte do
    comportamento especificado e independe da implementação; caixa-branca parte da estrutura interna; as baseadas em
    experiência dependem do conhecimento do testador e complementam as outras duas.
"4.2":
  curto: "Técnicas caixa-preta: EP, BVA, tabela de decisão e transição de estados."
  resumo: >-
    Introduz as quatro técnicas baseadas em especificação mais usadas, detalhadas nas subseções.
"4.2.1":
  curto: "Particionamento de equivalência (equivalence partitioning) e cobertura Each Choice."
  resumo: >-
    Divide os dados em partições que o objeto de teste deve tratar da mesma forma, e um valor por partição basta.
    As partições não se sobrepõem e não são vazias, e podem ser válidas ou inválidas. Cobertura = partições exercitadas
    ÷ partições identificadas (inclusive inválidas). Com vários conjuntos de partições, o critério mais simples é Each Choice.
"4.2.2":
  curto: "Análise de valor limite (boundary value analysis) nas versões de 2 e 3 valores."
  resumo: >-
    Só vale para partições ordenadas e testa os limites, onde os desenvolvedores mais erram. Na BVA de 2 valores, cada limite
    gera dois itens (o limite e o vizinho da partição adjacente); na de 3 valores, três (o limite e os dois vizinhos).
    A de 3 valores é mais rigorosa e pega defeitos que a de 2 valores deixa passar.
"4.2.3":
  curto: "Teste de tabela de decisão (decision table testing) para combinações de condições."
  resumo: >-
    Linhas são condições e ações; colunas são regras (combinações). Usa a notação T/F/–/N/A para condições e X para ações,
    em tabelas de entrada limitada ou estendida. Os itens de cobertura são as colunas viáveis. É sistemática e revela lacunas
    nos requisitos, mas cresce exponencialmente, o que se reduz minimizando a tabela ou priorizando por risco.
"4.2.4":
  curto: "Teste de transição de estados (state transition testing) e seus três critérios de cobertura."
  resumo: >-
    Modela estados, eventos, condições de guarda e ações (diagrama ou tabela de estados, que mostra também as transições inválidas).
    Critérios: todos os estados; transições válidas (0-switch, o mais usado); e todas as transições (válidas e inválidas, uma inválida
    por caso para evitar mascaramento). Todas as transições é o mínimo para software crítico.
"4.3":
  curto: "Técnicas caixa-branca: teste de instrução e de ramo."
  resumo: >-
    Foca as duas técnicas de código mais simples e populares. Técnicas mais rigorosas, ou não baseadas em código,
    estão fora do escopo.
"4.3.1":
  curto: "Teste e cobertura de instrução (statement coverage)."
  resumo: >-
    Os itens de cobertura são as instruções executáveis. 100% garante que toda instrução rodou ao menos uma vez, mas não
    pega defeitos dependentes de dados (ex.: divisão por zero) nem garante que toda a lógica de decisão foi exercitada.
"4.3.2":
  curto: "Teste e cobertura de ramo (branch coverage); ramo subsume instrução."
  resumo: >-
    Um ramo é uma transferência de controle no grafo de fluxo, condicional ou incondicional. Os itens de cobertura são os ramos.
    100% de ramo implica 100% de instrução (o inverso não vale), mas não garante cobrir caminhos específicos.
"4.3.3":
  curto: "Valor e limitação do teste caixa-branca."
  resumo: >-
    Considera toda a implementação, mesmo com especificação vaga, e dá uma medida objetiva de cobertura de código,
    que o caixa-preta não fornece. Também serve em teste estático (dry run). Não detecta defeitos de omissão,
    ou seja, requisitos não implementados.
"4.4":
  curto: "Técnicas baseadas em experiência: suposição de erro, exploratório e checklist."
  resumo: >-
    Introduz as três técnicas que dependem do conhecimento e da experiência do testador.
"4.4.1":
  curto: "Suposição de erro (error guessing) e ataques de falha."
  resumo: >-
    Antecipa erros, defeitos e falhas com base no histórico da aplicação, nos erros típicos dos desenvolvedores e em falhas
    de sistemas parecidos, em categorias como entrada, saída, lógica, cálculo, interface e dados. Os ataques de falha
    (fault attacks) formalizam isso com uma lista de possíveis problemas para provocar.
"4.4.2":
  curto: "Teste exploratório e teste baseado em sessão (carta de teste, timebox, debriefing)."
  resumo: >-
    O testador projeta, executa e avalia ao mesmo tempo em que aprende sobre o objeto. Na forma baseada em sessão, usa
    timebox, carta de teste e debriefing. Útil com especificação fraca ou pouco tempo, e como complemento. Rende mais com
    testadores experientes e pode combinar outras técnicas.
"4.4.3":
  curto: "Teste baseado em checklist."
  resumo: >-
    Os testes cobrem condições de uma checklist construída com experiência e conhecimento do usuário, geralmente em forma de
    perguntas verificáveis individualmente. Deve ser atualizada com base em análise de defeitos, sem crescer demais e sem
    itens automatizáveis. Dá consistência, ao custo de alguma variabilidade.
"4.5":
  curto: "Abordagens colaborativas focadas em evitar defeitos."
  resumo: >-
    Enquanto as técnicas anteriores visam detectar defeitos, as abordagens baseadas em colaboração buscam também evitá-los
    por meio de comunicação.
"4.5.1":
  curto: "Escrita colaborativa de user stories: 3 C's e INVEST."
  resumo: >-
    User story = Card, Conversation e Confirmation (critérios de aceite), no formato "Como [papel], quero [objetivo], para [valor]".
    É escrita em conjunto pelas perspectivas de negócio, desenvolvimento e teste. Boas stories seguem INVEST. Se ninguém sabe
    como testá-la, provavelmente está mal definida.
"4.5.2":
  curto: "Critérios de aceite: finalidade e formatos (cenário ou regra)."
  resumo: >-
    São as condições para o stakeholder aceitar a story e funcionam como condições de teste. Definem escopo, geram consenso,
    descrevem cenários positivos e negativos e apoiam estimativas. Formatos mais comuns: orientado a cenário (Given/When/Then)
    e orientado a regra (lista de verificação ou tabela entrada-saída).
"4.5.3":
  curto: "ATDD: casos de teste a partir dos critérios de aceite, antes da implementação."
  resumo: >-
    Começa com um workshop de especificação; os testes, vistos como exemplos, são criados pelo time. A ordem típica é
    positivos, depois negativos, depois não funcionais. Devem cobrir toda a story sem ir além e sem duplicar, e quando
    automatizados viram requisitos executáveis.

# ---------------------------------------------------------------- Capítulo 5
"5":
  curto: "Gestão do teste: planejamento, estimativa, priorização, riscos, monitoramento, relatórios, configuração e defeitos."
  resumo: >-
    Trata do lado gerencial: conteúdo do plano de teste, contribuição em planejamento ágil, critérios de entrada e saída,
    quatro técnicas de estimativa, priorização, pirâmide e quadrantes, gestão de risco de projeto e de produto,
    métricas e relatórios, gestão de configuração e relatório de defeito.
"5.1":
  curto: "Planejamento de teste e ferramentas de apoio ao planejamento."
  resumo: >-
    Reúne o plano de teste, o planejamento de iteração e release, os critérios de entrada e saída, a estimativa,
    a priorização, a pirâmide de teste e os quadrantes.
"5.1.1":
  curto: "Finalidade e conteúdo típico de um plano de teste."
  resumo: >-
    O plano documenta meios e cronograma, comunica e demonstra aderência à política e à estratégia. O conteúdo típico inclui
    contexto e escopo, premissas e restrições, stakeholders, comunicação, registro de riscos, abordagem de teste (níveis,
    tipos, técnicas, critérios, métricas, dados, ambiente) e orçamento e cronograma. Referência: ISO/IEC/IEEE 29119-3.
"5.1.2":
  curto: "Contribuição do testador no planejamento de release e de iteração."
  resumo: >-
    No release, ajuda a escrever stories e critérios testáveis, participa da análise de risco, estima esforço e define a
    abordagem. Na iteração, detalha riscos das stories, avalia testabilidade, quebra stories em tarefas de teste e estima cada uma.
"5.1.3":
  curto: "Critérios de entrada e de saída (Definition of Ready / Definition of Done)."
  resumo: >-
    Os critérios de entrada são as precondições para iniciar uma atividade (recursos, testware, qualidade inicial). Os de saída
    definem quando ela termina (medidas de rigor como cobertura e defeitos abertos, mais critérios sim/não). Falta de tempo
    ou verba pode encerrar o teste se o risco for aceito. Em ágil, viram DoR e DoD.
"5.1.4":
  curto: "Quatro técnicas de estimativa: razões, extrapolação, Wideband Delphi e três pontos."
  resumo: >-
    Razões e extrapolação são baseadas em métricas (dados históricos ou do projeto atual); Wideband Delphi (e Planning Poker)
    e três pontos são baseadas em especialistas. Na de três pontos, E = (a + 4m + b) / 6 e DP = (b − a) / 6. Toda estimativa
    tem premissas e erro, e tarefas grandes devem ser decompostas.
"5.1.5":
  curto: "Priorização de casos de teste: por risco, por cobertura e por requisitos."
  resumo: >-
    As estratégias mais comuns ordenam a execução por risco, por cobertura (incluindo a cobertura adicional) ou pela prioridade
    dos requisitos. Dependências entre testes e a disponibilidade de recursos podem forçar outra ordem.
"5.1.6":
  curto: "Pirâmide de teste."
  resumo: >-
    Modelo em camadas: na base, muitos testes pequenos, isolados e rápidos; no topo, poucos testes ponta a ponta, lentos e amplos.
    Orienta a automação e a alocação de esforço. O número e o nome das camadas variam (ex.: unit/service/UI, de Cohn).
"5.1.7":
  curto: "Quadrantes de teste de Marick (Q1 a Q4)."
  resumo: >-
    Cruzam "voltado ao negócio ou à tecnologia" com "apoia o time ou critica o produto". Q1: componente e integração,
    automatizados. Q2: funcionais, exemplos, stories e API. Q3: exploratório, usabilidade e UAT, geralmente manuais.
    Q4: smoke e não funcionais, geralmente automatizados.
"5.2":
  curto: "Gestão de riscos e teste baseado em risco."
  resumo: >-
    A gestão de risco tem duas atividades principais: análise (identificação e avaliação) e controle (mitigação e monitoramento).
    Selecionar, priorizar e gerir o teste com base nelas é o teste baseado em risco (risk-based testing).
"5.2.1":
  curto: "Risco, probabilidade, impacto e nível de risco."
  resumo: >-
    Risco é um evento potencial com efeito adverso, caracterizado pela probabilidade (entre 0 e 1) e pelo impacto.
    Os dois juntos dão o nível de risco: quanto maior, mais prioritário o tratamento.
"5.2.2":
  curto: "Riscos de projeto vs riscos de produto."
  resumo: >-
    Os riscos de projeto vêm da gestão (organização, pessoas, técnica, fornecedores) e afetam prazo, custo e escopo.
    Os de produto se ligam às características de qualidade (ISO 25010) e podem causar insatisfação, prejuízo, danos
    a terceiros, penalidades e até danos físicos.
"5.2.3":
  curto: "Análise de risco de produto: identificação, avaliação e uso dos resultados."
  resumo: >-
    Identifica riscos (brainstorming, workshops, entrevistas, diagramas de causa e efeito) e os avalia (categoria, probabilidade,
    impacto, nível e prioridade), de forma quantitativa (probabilidade × impacto) ou qualitativa (matriz de risco). O resultado
    define escopo, níveis, tipos, técnicas, cobertura, esforço e prioridade do teste.
"5.2.4":
  curto: "Controle de risco de produto: mitigação, monitoramento e respostas."
  resumo: >-
    As respostas possíveis são mitigar pelo teste, aceitar, transferir ou ter plano de contingência. Para mitigar pelo teste:
    escolher testadores adequados, ajustar a independência, revisar e fazer análise estática, aplicar técnicas e cobertura
    apropriadas, cobrir as características afetadas e testar dinamicamente com regressão. O monitoramento confirma a eficácia
    e revela riscos novos.
"5.3":
  curto: "Monitoramento, controle e conclusão do teste."
  resumo: >-
    O monitoramento coleta informação sobre progresso e critérios de saída. O controle emite diretivas corretivas
    (repriorizar, reavaliar critérios, ajustar cronograma, adicionar recursos). A conclusão consolida experiência e
    testware nos marcos do projeto.
"5.3.1":
  curto: "Métricas usadas em teste."
  resumo: >-
    Categorias: progresso do projeto, progresso do teste, qualidade do produto (ex.: MTTF), defeitos (ex.: densidade,
    percentual de detecção), risco residual, cobertura e custo, incluindo o custo da qualidade.
"5.3.2":
  curto: "Relatório de progresso vs relatório de conclusão: finalidade, conteúdo e público."
  resumo: >-
    O relatório de progresso é periódico e apoia o controle: período, avanço, impedimentos, métricas, riscos e próximo período.
    O de conclusão sai ao fim de um nível, ciclo ou projeto: resumo, avaliação frente ao plano, desvios, riscos não mitigados,
    defeitos abertos e lições aprendidas. O público define formalidade e frequência.
"5.3.3":
  curto: "Formas de comunicar o status do teste."
  resumo: >-
    Conversa direta, dashboards (CI/CD, quadros de tarefas, burn-down), canais eletrônicos, documentação online e relatórios formais.
    Times distribuídos tendem a precisar de mais formalidade, e a informação deve ser ajustada a cada stakeholder.
"5.4":
  curto: "Gestão de configuração em apoio ao teste."
  resumo: >-
    Identifica, versiona e rastreia itens de configuração do teste (planos, casos, scripts, resultados, ambientes). Itens aprovados
    viram baseline e só mudam por controle formal de mudança, o que permite reproduzir resultados anteriores. Em DevOps,
    a gestão de configuração costuma ser automatizada no pipeline.
"5.5":
  curto: "Gestão de defeitos e conteúdo de um relatório de defeito."
  resumo: >-
    O processo leva cada anomalia do registro ao fechamento: registrar, analisar, classificar, decidir e fechar. A anomalia pode
    nem ser defeito (falso positivo, pedido de mudança). O relatório deve permitir resolver, acompanhar a qualidade e melhorar o processo.
    Campos típicos: ID, título, data e autor, objeto e ambiente, contexto, passos para reproduzir, resultado esperado e obtido,
    severidade, prioridade, status e referências.

# ---------------------------------------------------------------- Capítulo 6
"6":
  curto: "Ferramentas de teste: categorias e benefícios e riscos da automação."
  resumo: >-
    O capítulo mais curto. Classifica as ferramentas que apoiam o teste e lista os benefícios e riscos da automação.
"6.1":
  curto: "Categorias de ferramentas que apoiam o teste."
  resumo: >-
    Gestão de teste, teste estático, projeto e implementação, execução e cobertura, teste não funcional, DevOps, colaboração,
    escalabilidade (VMs, containers) e qualquer outra que ajude, até uma planilha.
"6.2":
  curto: "Benefícios e riscos da automação de teste."
  resumo: >-
    Benefícios: menos trabalho repetitivo, consistência, avaliação objetiva, melhor informação para gestão, feedback mais rápido
    e mais tempo para testes melhores. Riscos: expectativas irreais, estimativas erradas, automatizar o que deveria ser manual,
    dependência excessiva da ferramenta ou do fornecedor, projetos open source abandonados, incompatibilidade de plataforma
    e não conformidade regulatória.
